<header>
  <app-navbar></app-navbar>
  <app-clock></app-clock>
</header>

<main
  class="post-create-page-container"
  aria-label="Post Form Page"
  role="main">
  <article class="main-content">
    <div class="page-header">
      <a routerLink="/posts" class="back-link" aria-label="Back to all posts."
        ><mat-icon>arrow_back</mat-icon>
        <span>All Posts</span>
      </a>
    </div>
    <app-post-form></app-post-form>
  </article>

  <aside class="side-content" role="complementary" aria-label="Recent Posts">
    <app-recent-posts [recentPosts]="recentPosts()"></app-recent-posts>
  </aside>
</main>

<app-footer></app-footer>
