<mat-card>
  <mat-card-header>
    <mat-card-title>Recent Posts</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-list class="recent-posts" aria-label="Recent Posts">
      @if (recentPosts$ | async; as posts) { @for (post of posts; track post.id)
      {
      <mat-list-item lines="2" [routerLink]="['/posts', post.id]">
        <mat-icon matListItemIcon>article</mat-icon>
        <span matListItemTitle>{{ post.title }}</span>
        <span matListItemLine>{{ post.author }}</span>
      </mat-list-item>
      <mat-divider></mat-divider>
      } @empty {
      <mat-list-item>
        <mat-icon matListItemIcon>inbox</mat-icon>
        <span matListItemTitle>No Recent Posts</span>
      </mat-list-item>
      } } @else {
      <div class="spinner-container">
        <mat-spinner diameter="36"></mat-spinner>
      </div>
      }
    </mat-list>
  </mat-card-content>
</mat-card>
